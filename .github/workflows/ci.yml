name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository (no writes, no packages).
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR invalidates the old run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Flutter version is pinned to the toolchain used locally (Flutter 3.38.6 / Dart 3.10.7).
      # sodium 3.x is pinned in pubspec.yaml because sodium 4.x requires Dart 3.11+, so the
      # CI SDK must not drift ahead of the local one.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        # --enforce-lockfile: CI must build the EXACT resolution in pubspec.lock;
        # a drifting transitive dependency fails the job instead of being picked up.
        run: flutter pub get --enforce-lockfile

      # No native libsodium package is installed on purpose: the sodium_libs Flutter plugin
      # is not registered in the plain `flutter test` VM host, and no test under test/ imports
      # package:sodium or package:sodium_libs (crypto round-trips live in integration_test/,
      # which needs a device/simulator and is therefore not run here).
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
