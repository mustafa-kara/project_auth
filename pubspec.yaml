name: project_auth
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  get_it: ^9.2.1
  supabase_flutter: ^2.17.2
  # E2E kripto: sodium_libs pre-built libsodium binary'lerini yükler (stable Flutter'da
  # çalışır, native-assets/experiment flag gerekmez). sodium 4.x Dart 3.11+ ister; bu
  # toolchain Dart 3.10.7 olduğundan 3.x hattı kullanılır. Faz 2 — bkz. docs/CRYPTO.md.
  sodium: ^3.4.6
  sodium_libs: ^3.4.6+4
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^7.4.0
  local_auth: ^3.0.2
  # Patch 5: Android API<28 biyometri SDK gate'i (flutter_secure_storage native
  # enforceBiometrics <28'de exception fırlatır → buton görünmesin diye SDK kontrolü).
  device_info_plus: ^12.1.0
  equatable: ^2.1.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  # Faz 5 Patch 1 — import/export dosya seçimi ve kaydı. TEK paket yeter:
  # `pickFiles(withData: true)` bytes'ı belleğe okur (path/izin gerekmez; Android
  # SAF + iOS document picker runtime izin İSTEMEZ) ve `saveFile(bytes:)` dosyayı
  # Android/iOS'ta da yazar (paket kaynağı: mobil kanalda `bytes` ZORUNLU, masaüstünde
  # verilirse yazılır) → share_plus/path_provider fallback'i GEREKMEZ.
  # 11.x hattı: file_picker >=12.1.3 → windows_file_picker → win32 ^6.3.0 iken
  # device_info_plus ^12.1.0 (Patch 5 Android SDK gate'i) win32 ^5.11.0 istiyor →
  # 12.x sürüm çözümü ÇAKIŞIR. 11.0.3 aynı API'yi (withData/saveFile bytes) sunar.
  # PIN'İN BEDELİ (ikisi de PLAN.md Faz 7'de iş kalemi):
  #  1) file_picker 12'ye geçiş TEK BAŞINA yapılamaz — device_info_plus 13'ü de
  #     beraberinde getirir; tek bir bağlı yükseltme olarak planlanmalı.
  #  2) 11.0.3'ün iOS podspec'i `PICKER_MEDIA` varsayılanda açık olduğu için
  #     `DKImagePickerController/PhotoGallery` (→ SDWebImage, SwiftyGif) çeker
  #     (bkz. ios/Podfile.lock). Uygulama YALNIZ doküman seçiyor; yine de fotoğraf
  #     kitaplığı API'leri binary'ye giriyor → App Store incelemesinde
  #     `NSPhotoLibraryUsageDescription` sorusu. Çıkış yolu: ios/Podfile'da
  #     `PICKER_MEDIA=false`.
  file_picker: ^11.0.3
  # Zaten `file_picker`'ın transitive bağımlılığıydı; DOĞRUDAN bağımlılığa
  # yükseltildi çünkü `FilePickerDocumentPort` iOS'ta artık dosyayı temizlemek
  # için `getApplicationDocumentsDirectory()`'yi kendisi çağırır: file_picker
  # 11.0.3 `saveFile`'ı iOS'ta önce `NSDocumentDirectory/<fileName>` altına
  # yazıp oradan dışa aktarır ve o nüshayı HİÇBİR yolda silmez
  # (`ios/.../FilePickerPlugin.m` `saveFileWithName:`) → şifreli yedek iCloud
  # yedeğine sızardı. Bkz. `file_picker_document_port.dart`.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # libsodium (sodium_libs) Flutter platform plugin'i plain `flutter test` VM host'unda
  # yüklenmez (SodiumPlatform.instance init edilmez). Kripto round-trip testleri bu yüzden
  # integration_test ile cihaz/simülatörde çalışır; saf-Dart testler (bip39, JSON) normal
  # `flutter test`te kalır. Bkz. docs/CRYPTO.md → test stratejisi.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Servis logoları (simple-icons, CC0) — offline; tema rengiyle boyanır.
  # Bkz. assets/icons/README.md (lisans + kullanım).
  assets:
    - assets/icons/

  # Tasarım dili tipografisi (Design.md §3.2): Geist (display/gövde) + Geist Mono
  # (kod/sayaç/recovery). Gömülü (runtime fetch YOK — offline + gizlilik). Lisans:
  # SIL OFL 1.1 — assets/fonts/OFL.txt (kaynaktan teyit edildi).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
